name: CI

# ─────────────────────────────────────────────────────────────────────────────
# Architecture:
#   Frontend → Vercel  (auto-deploys from GitHub on every push — no action needed)
#   Backend  → Render  (Docker-based; triggered via deploy hook after CI passes)
#   Domain   → Hostinger DNS (CNAME www → Vercel; backend served from Render URL)
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Rust Backend ─────────────────────────────────────────────────────────────
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      # L-5 fix: Pinned to a specific commit SHA to prevent supply-chain attacks
      # (a tag like @v4 can be silently moved to a malicious commit)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry + build artifacts
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: cargo-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --check

      - name: Compile check
        run: cargo check --all-targets

      - name: Clippy (treat warnings as errors in CI)
        run: cargo clippy --all-targets -- -D warnings

      # L-6 fix: Audit Rust dependencies for known CVEs
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        run: cargo audit

      - name: Run tests
        run: cargo test

  # ── Next.js Frontend ─────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # L-6 fix: Fail CI on high-severity npm vulnerabilities
      - name: Audit npm dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Next.js build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://mvr-umqq.onrender.com
          NEXT_PUBLIC_APP_URL: https://www.mvrconsultants.org

  # ── Deploy backend to Render (main branch only) ───────────────────────────────
  # Vercel deploys the frontend automatically via its GitHub integration.
  # We only need to explicitly trigger the Render backend deploy.
  deploy-backend:
    name: Deploy Backend → Render
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment: production
    continue-on-error: true

    steps:
      - name: Validate deploy hook secret
        run: |
          HOOK_URL="$(echo "$RENDER_DEPLOY_HOOK_URL" | tr -d '[:space:]')"
          if [ -z "$HOOK_URL" ]; then
            echo "❌ RENDER_DEPLOY_HOOK_URL secret is not set."
            echo "GitHub → Settings → Environments → production → Environment secrets"
            echo "Add secret: RENDER_DEPLOY_HOOK_URL"
            echo "Get the URL from: Render Dashboard → mvr-backend → Settings → Deploy Hook"
            exit 1
          fi
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

      - name: Trigger Render deploy hook
        run: |
          HOOK_URL="$(echo "$RENDER_DEPLOY_HOOK_URL" | tr -d '[:space:]')"
          echo "Triggering Render deploy for mvr-backend..."
          HTTP_CODE="$(curl -sS --retry 3 -o /dev/null -w "%{http_code}" "$HOOK_URL")"
          echo "HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "202" ]; then
            echo "✅ Render deploy triggered — monitor at https://dashboard.render.com"
          else
            if [ "$HTTP_CODE" = "401" ]; then
              echo "::warning::Render deploy hook returned 401 — regenerate hook in Render and update RENDER_DEPLOY_HOOK_URL in GitHub Environment 'production'"
            fi
            echo "::error::Render deploy hook failed (HTTP $HTTP_CODE). Backend was not redeployed; fix RENDER_DEPLOY_HOOK_URL or deploy manually from Render."
            exit 1
          fi
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

